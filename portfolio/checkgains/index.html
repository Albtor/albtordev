    <div class="centerBox">
    <h1 class="title">Check Gains</h1>

    <form action="#" class="form">
        <div>
            <label for="">Coin Name</label>
            <!-- <input type="text" class="coin editable"> -->
            <!-- <select onchange="val()" name="coinz editable" id="coinz"> -->
            <select onchange="Clear(id)" name="coinz editable" id="coinz">
                <option value=""></option>
                <option value="btc">Bitcoin</option>
                <option value="eth">Ethereum</option>
                <option value="ada">Cardano</option>
                <option value="dot">Polkadot</option>
                <option value="ros">Rose</option>
                <option value="sol">Solana</option>
                <option value="pol">Polygon</option>
                <option value="fil">Filecoin</option>
                <option value="one">Harmony</option>
                <option value="monr">Moonriver</option>
                <option value="scr">Secret</option>
                <option value="rdx">Radicle</option>
                <option value="min">Mina</option>
                <option value="mask">Mask</option>
                <option value="git">Gitcoin</option>
                <option value="kus">Kusama</option>
                <option value="grt">The Graph</option>
                <option value="run">ThorChain</option>
                <option value="sta">Stacks</option>
                <option value="uni">Uniswap</option>
                <option value="lit">Litecoin</option>
                <option value="xmr">Monero</option>    
                <option value="zec">Zcash</option>    
                <option value="btt">BitTorrent</option>  
            </select>
        </div>
        <div>
            <label for="">Money Spent</label>
            <input type="text" class="Money editable">
        </div>
        <div>
            <label for="">Price Buy</label>
            <input type="text" class="PriceBuy editable">
        </div>
        <div>
            <label for="">Price Sell</label>
            <input type="text" class="PriceSell editable">
        </div>
        <div>
            <label for="">Fee Buy</label>
            <input type="text" class="FeeBuy editable">
        </div>
        <div>
            <label for="">Fee Sell</label>
            <input type="text" class="FeeSell editable">
        </div>
        <div>
            <label for="">Quantity</label>
            <input type="text" class="Quantity nonEditable" readonly>
        </div>
        <div>
            <label for="">Total</label>
            <input type="text" class="Total nonEditable" readonly>
        </div>
        <div>
            <label for="">Difference</label>
            <input type="text" class="Difference nonEditable" readonly>
        </div>
        <div>
            <label for="">Percentage</label>
            <input type="text" class="Porcentaje nonEditable" readonly>
        </div>
        <div>
            <label for="">C. Supply (M)</label>
            <input type="text" class="CircSupply nonEditable">
        </div>
        <div>
            <label for="">MarketCap Buy</label>
            <input type="text" class="MarketCapN nonEditable" readonly>
        </div>
        <div>
            <label for="">MarketCap Sell</label>
            <input type="text" class="MarketCapF nonEditable" readonly>
        </div>
        <div>
            <label for="">To Declare</label>
            <input type="text" class="ToDeclare nonEditable" readonly>
        </div>
        <div>
            <label for="">Tax 23%</label>
            <input type="text" class="Tax nonEditable" readonly>
        </div>
        <div class="buttons">
            <input type="button" onclick="Calculate()" value="Calculate" class="button">
            <input type="button" onclick="Clear(id)" value="Clear" class="button" id="buttonclear">
            <!-- <button onclick="Calculate()" class="button">Calculate</button>  -->
            <!-- <button onclick="Clear()" class="button">Clear</button>  -->
        </div>
        
    </form>
