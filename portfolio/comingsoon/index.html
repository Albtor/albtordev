<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=500, initial-scale=1">
    <title>Responsive Web Coming Soon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="#" class="logo">Coming Soon</a>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
            </ul>
        </nav>
    </header>
    <section>
        <img src="img/curve.png" alt="background wavy image" class="wave">
        <div class="contentBx">
            <h2>Coming Soon</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quos nesciunt illo aut cumque totam cum odit doloremque, voluptas voluptatem</p>
            <div class="countdown">
                <div class="time"><div id="day"></div><span>Days</span></div>
                <div class="time"><div id="hour"></div><span>Hours</span></div>
                <div class="time"><div id="minute"></div><span>Minutes</span></div>
                <div class="time"><div id="second"></div><span>Seconds</span></div>
            </div>
            <a href="#" onclick="toggle();">Notify me</a>
        </div>
        <div class="imgBx">
            <img src="img/man.png" alt="">
        </div>
        <ul class="sci">
            <li><a href="#"><img src="img/facebook.png" alt=""></a></li>
            <li><a href="#"><img src="img/instagram.png" alt=""></a></li>
            <li><a href="#"><img src="img/twitter.png" alt=""></a></li>
        </ul>
    </section>
    <div class="newsletter">
        <h2>Stay Tuned</h2>
        <p>Get notified at launch</p>
        <div class="inputBox">
            <form >
                <input type="email" name="email" required="" placeholder="Enter email address">
                <input type="submit" value="Submit">
            </form>
        </div>
        <img src="img/close.png" class="close" alt="x symbol to close ad" onclick="toggle();">
    </div>
    
    <script src="main.js"></script>
</body>
</html>
