<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Soundwave - Discover</title>
    <link rel="stylesheet" type="" href="styles.css">
    <link rel="stylesheet" type="" href="join.css">
</head>
<body class="full-height-grow">
    <div class="container full-height-grow">
        <header class="main-header">
        	<a href="index.html" class="brand-logo">
        		<img src="img/logo.png" alt="logo">
        		<div class="brand-logo-name">Soundwave</div>
        	</a>

        	<nav class="main-nav">
        		<ul>
        			<li><a href="discover.html">Discover</a></li>
        			<li><a href="join.html">Join</a></li>
        		</ul>
        	</nav>
        </header>

        <section class="join-main-section">
            <h1 class="join-text">Join the <span class="accent-text">fun.</span></h1>

            <form action="" class="join-form">
                <div class="input-group">
                    <label>Name:</label>
                    <input type="text">
                    <label>Email</label>
                    <input type="email">
                    <label>Password</label>
                    <input type="password">
                </div>
                <div class="input-group">
                    <button type="submit" class="btn">Join now</button>
                </div>
            </form>
        </section>

    </div>

    <div class="join-page-circle-1"></div>
    <div class="join-page-circle-2"></div>
    <div class="join-page-circle-3"></div>

    <footer class="main-footer">
        <!-- se pone container class para que se elineeen los elementos igual que en el header y el resto de la página -->
        <div class="container">
            <nav class="footer-nav">
                <ul class="nav1">
                    <li><a href="#">About us</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

            <nav class="footer-nav">
                <ul class="nav2">
                    <li>
                        <img src="img/twitter.svg" alt="twitter-icon">
                        <a href="#" class="social-link">Twitter</a></li>
                    <li>
                        <img src="img/facebook.svg" alt="fb-icon">
                        <a href="#"  class="social-link">Facebook</a></li>
                </ul>
            </nav>
            
        </div>

    </footer>
</body>
</html>
